<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOH COIN</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #3b250d, #120b04 60%, #050505);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .game {
      width: min(430px, 100%);
      text-align: center;
      background: rgba(20, 12, 4, .88);
      border: 2px solid #d99a32;
      border-radius: 24px;
      padding: 24px 18px 28px;
      box-shadow: 0 0 35px rgba(255, 177, 45, .25);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 38px;
      color: #ffd76a;
      letter-spacing: 3px;
      text-shadow: 0 3px 12px #000;
    }
    .subtitle {
      color: #e8c98c;
      margin-bottom: 18px;
    }
    .score {
      font-size: 30px;
      font-weight: bold;
      margin: 10px 0 4px;
      color: #ffd76a;
    }
    .stats {
      color: #d9c7a5;
      margin-bottom: 18px;
    }
    .coin {
      width: min(310px, 82vw);
      aspect-ratio: 1;
      border: 0;
      border-radius: 50%;
      padding: 0;
      cursor: pointer;
      background: #d89a31;
      box-shadow: 0 12px 0 #80510e, 0 18px 30px rgba(0,0,0,.5);
      overflow: hidden;
      transition: transform .08s, box-shadow .08s;
      -webkit-tap-highlight-color: transparent;
    }
    .coin:active {
      transform: translateY(9px) scale(.97);
      box-shadow: 0 3px 0 #80510e, 0 10px 20px rgba(0,0,0,.45);
    }
    .coin img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    button.small {
      border: 1px solid #d99a32;
      background: #2a1908;
      color: #ffd76a;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      cursor: pointer;
    }
    button.small:active { transform: scale(.97); }
    .upgrade {
      margin-top: 16px;
      padding: 14px;
      border-radius: 14px;
      background: rgba(255, 190, 70, .08);
      border: 1px solid rgba(217,154,50,.45);
    }
    .upgrade button {
      margin-top: 8px;
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px;
      background: #d99a32;
      color: #160d03;
      font-weight: bold;
      cursor: pointer;
    }
    .message {
      min-height: 22px;
      margin-top: 10px;
      color: #ffe8ae;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>SHOH COIN</h1>
    <div class="subtitle">Coin yig‘ing va rekord o‘rnating! 👑</div>

    <div class="score">🪙 <span id="coins">0</span></div>
    <div class="stats">Bosishlar: <span id="clicks">0</span> · Har bosishda: +<span id="power">1</span></div>

    <button class="coin" id="coinButton" aria-label="SHOH COIN ni bosish">
      <img src="coin.jpg" alt="SHOH COIN">
    </button>

    <div class="upgrade">
      <div>⚡ Kuchaytirish: <b>+1 → +2</b></div>
      <div>Narxi: 🪙 <span id="upgradeCost">50</span></div>
      <button id="upgradeButton">UPGRADE</button>
    </div>

    <div class="buttons">
      <button class="small" id="saveButton">💾 Saqlash</button>
      <button class="small" id="resetButton">🔄 Qayta boshlash</button>
    </div>

    <div class="message" id="message"></div>
  </main>

  <script>
    const state = {
      coins: Number(localStorage.getItem("shohCoins") || 0),
      clicks: Number(localStorage.getItem("shohClicks") || 0),
      power: Number(localStorage.getItem("shohPower") || 1),
      upgradeCost: Number(localStorage.getItem("shohUpgradeCost") || 50)
    };

    const coinsEl = document.getElementById("coins");
    const clicksEl = document.getElementById("clicks");
    const powerEl = document.getElementById("power");
    const upgradeCostEl = document.getElementById("upgradeCost");
    const messageEl = document.getElementById("message");

    function render() {
      coinsEl.textContent = state.coins;
      clicksEl.textContent = state.clicks;
      powerEl.textContent = state.power;
      upgradeCostEl.textContent = state.upgradeCost;
    }

    function save() {
      localStorage.setItem("shohCoins", state.coins);
      localStorage.setItem("shohClicks", state.clicks);
      localStorage.setItem("shohPower", state.power);
      localStorage.setItem("shohUpgradeCost", state.upgradeCost);
    }

    document.getElementById("coinButton").addEventListener("click", () => {
      state.coins += state.power;
      state.clicks++;
      render();
      save();
    });

    document.getElementById("upgradeButton").addEventListener("click", () => {
      if (state.coins < state.upgradeCost) {
        messageEl.textContent = "❌ Upgrade uchun coin yetarli emas!";
        return;
      }
      state.coins -= state.upgradeCost;
      state.power++;
      state.upgradeCost = Math.ceil(state.upgradeCost * 1.8);
      messageEl.textContent = "🔥 Upgrade muvaffaqiyatli!";
      render();
      save();
    });

    document.getElementById("saveButton").addEventListener("click", () => {
      save();
      messageEl.textContent = "✅ Natija saqlandi!";
    });

    document.getElementById("resetButton").addEventListener("click", () => {
      if (!confirm("Barcha natijani o‘chirishni xohlaysizmi?")) return;
      state.coins = 0;
      state.clicks = 0;
      state.power = 1;
      state.upgradeCost = 50;
      save();
      render();
      messageEl.textContent = "🔄 O‘yin qayta boshlandi.";
    });

    render();
  </script>
</body>
</html>
